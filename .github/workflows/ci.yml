name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build --platform "${{ matrix.platform }}" --tag product-template:ci .
      - name: Smoke-test container and health check
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.Config.User}}' product-template:ci)" = "node"
          container_id="$(docker run --detach --publish 127.0.0.1::8080 product-template:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          status="starting"
          for attempt in {1..45}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              break
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          if [[ "$status" != "healthy" ]]; then
            docker logs "$container_id"
            echo "Container health status: $status"
            exit 1
          fi
          response="$(curl --fail --silent --show-error "http://$(docker port "$container_id" 8080/tcp)/healthz")"
          test "$response" = '{"status":"ok"}'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          arch_tag="${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}-${{ matrix.suffix }}"
          docker tag product-template:ci "$arch_tag"
          docker push "$arch_tag"

  publish-manifest:
    name: publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Publish and verify main and commit manifests
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:sha-$SHORT_SHA" \
            "$IMAGE:sha-$SHORT_SHA-amd64" \
            "$IMAGE:sha-$SHORT_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$SHORT_SHA"
